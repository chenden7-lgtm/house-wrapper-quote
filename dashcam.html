<!DOCTYPE html>
<html lang="zh-TW" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好室多膜 特斯拉行車記錄器與電子後視鏡價目表 | 好室多膜</title>
  <meta name="description" content="好室多膜精選特斯拉專用流媒體電子後視鏡與前後雙鏡頭行車記錄器報價表，收錄大邁 M996、快譯通 S95B/S95A/S86/V92GH、DOD T-one plus、PAPAGO X898 與點煙器延伸孔，提供無損施工完工服務。">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    .dashcam-hero {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-bottom: 2rem;
      box-shadow: var(--shadow-sm);
    }
    
    .dashcam-category-bar {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .dashcam-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.55rem 1.35rem;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: all var(--transition-fast);
    }
    
    .dashcam-pill:hover {
      background: var(--bg-card-hover);
      color: var(--text-bright);
      border-color: var(--border-active);
    }
    
    .dashcam-pill.active {
      background: var(--orange-gradient);
      color: #ffffff !important;
      border-color: transparent;
      box-shadow: 0 4px 12px rgba(232, 86, 55, 0.3);
    }

    .dashcam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .dashcam-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all var(--transition-bounce);
      position: relative;
    }

    .dashcam-card:hover {
      transform: translateY(-4px);
      border-color: rgba(232, 86, 55, 0.5);
      box-shadow: 0 12px 28px rgba(0,0,0,0.12);
    }

    .dashcam-card-img-wrap {
      position: relative;
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: #111;
    }

    .dashcam-card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .dashcam-card:hover .dashcam-card-img {
      transform: scale(1.05);
    }

    .dashcam-card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--orange-gradient);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .dashcam-card-content {
      padding: 1.25rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .dashcam-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-bright);
      margin-bottom: 0.4rem;
    }

    .dashcam-card-fitment {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #059669;
      background: rgba(5, 150, 105, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 0.65rem;
    }

    .dashcam-card-note {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .dashcam-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding-top: 0.85rem;
      border-top: 1px solid var(--border-color);
    }

    .dashcam-price-wrap {
      display: flex;
      flex-direction: column;
    }

    .dashcam-price-orig {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .dashcam-price-val {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--primary);
    }

    .btn-add-quote {
      background: var(--orange-gradient) !important;
      background-color: #e85637 !important;
      color: #ffffff !important;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all var(--transition-fast);
      box-shadow: 0 4px 12px rgba(232, 86, 55, 0.25);
    }

    .btn-add-quote span { color: #ffffff !important; }

    .btn-add-quote:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 16px rgba(232, 86, 55, 0.4);
    }

    .btn-add-quote.added {
      background: #059669 !important;
      background-color: #059669 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="brand">
        <img src="images/house_wrapper_logo.svg" alt="好室多膜" class="brand-logo-img">
        <span class="brand-badge" style="margin-left: 0.35rem; font-size: 0.72rem; padding: 3px 10px; background: rgba(232, 86, 55, 0.12); color: #111111; font-weight: 800; border: 1px solid rgba(232, 86, 55, 0.3); letter-spacing: 0.03em;">一站式服務項目</span>
      </a>

      <div class="nav-actions">
        <a href="tinting.html" class="nav-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 600; background: var(--bg-card); color: var(--text-bright); border: 1px solid var(--border-color); border-radius: 20px;" title="查看特斯拉隔熱紙一站式服務價目表">
          <i class="fas fa-sun" style="color: #ffb703;"></i>
          <span>特斯拉隔熱紙價目</span>
        </a>

        <a href="electrical.html" class="nav-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 600; background: var(--bg-card); color: var(--text-bright); border: 1px solid var(--border-color); border-radius: 20px;" title="查看特斯拉電系改裝一站式服務價目表">
          <i class="fas fa-bolt" style="color: #ffb703;"></i>
          <span>特斯拉電系改裝價目</span>
        </a>

        <a href="dashcam.html" class="nav-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 700; background: rgba(232, 86, 55, 0.12); color: var(--primary); border: 1.5px solid var(--primary); border-radius: 20px;" title="查看行車記錄器與電子後視鏡價目">
          <i class="fas fa-video" style="color: #ffb703;"></i>
          <span>行車記錄器、電子後視鏡</span>
        </a>

        <a href="index.html" class="nav-btn" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 600; background: var(--bg-card); color: var(--text-bright); border: 1px solid var(--border-color); border-radius: 20px;" title="配件報價大廳">
          <i class="fas fa-boxes" style="color: var(--primary);"></i>
          <span>配件報價大廳</span>
        </a>

        <button id="btn-open-quote-drawer" class="nav-btn quote-btn" title="點擊檢視跨頁統一報價單">
          <i class="fas fa-shopping-cart" style="color: var(--primary);"></i> 
          <span>客戶 LINE 報價單</span>
          <span class="badge-count" id="nav-quote-count">0</span>
        </button>

        <button id="btn-theme-toggle" class="nav-btn theme-toggle" title="切換深/淺色主題">
          <i class="fas fa-sun"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 1.5rem;">
    <!-- Hero Header -->
    <section class="dashcam-hero">
      <h1 style="font-size: 1.85rem; font-weight: 900; color: var(--text-bright); margin-bottom: 0.5rem;">
        📷 好室多膜 <span style="color: #111111; font-weight: 900;">一站式服務</span> <span style="color: var(--primary);">特斯拉行車記錄器 / 電子後視鏡價目表</span>
      </h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; max-width: 760px; margin: 0 auto;">
        收錄大邁 M996、快譯通 Abee（S95B / S95A / S86 / V92GH）、DOD T-one plus 與 PAPAGO X898 等各大品牌。提供特斯拉專用走線無損安裝與完工保固！
      </p>
    </section>

    <!-- Top Store Notice Banner -->
    <div style="background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(5, 150, 105, 0.12)); border: 1.5px solid rgba(16, 185, 129, 0.4); padding: 1.1rem 1.5rem; border-radius: 14px; margin-bottom: 1.5rem; text-align: center; box-shadow: 0 4px 16px rgba(16,185,129,0.08);">
      <div style="font-weight: 900; font-size: 1.12rem; color: #047857; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
        <i class="fas fa-wrench"></i> 商品價格已包含所有安裝費用
      </div>
      <div style="font-size: 0.92rem; color: var(--text-bright); font-weight: 700;">
        因本身價格已非常優惠，恕無額外折價優惠
      </div>
    </div>

    <!-- Category Filter Bar -->
    <div class="dashcam-category-bar" id="dashcam-category-container">
      <button class="dashcam-pill active" data-cat="all">
        <i class="fas fa-th-large"></i> 全部項目 (8)
      </button>
      <button class="dashcam-pill" data-cat="mirror">
        <i class="fas fa-car-rear"></i> 電子後視鏡 (6)
      </button>
      <button class="dashcam-pill" data-cat="dashcam">
        <i class="fas fa-video"></i> 行車記錄器 (1)
      </button>
      <button class="dashcam-pill" data-cat="addon">
        <i class="fas fa-plug"></i> 必備加購品 (1)
      </button>
    </div>

    <!-- Product Grid -->
    <div class="dashcam-grid" id="dashcam-grid">
      <!-- Dynamically Rendered -->
    </div>
  </main>

  <!-- Sliding Quote Drawer Overlay -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <div class="quote-drawer" id="quote-drawer">
    <button class="drawer-close" id="btn-close-quote-drawer"><i class="fas fa-times"></i></button>
    <div id="drawer-content-area"></div>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { DASHCAM_ITEMS } from './js/dashcamData.js?v=20260924_v1';
    import { QuotationManager } from './js/quotation.js?v=20260924_v3';

    const quotationManager = new QuotationManager('quoteCart');
    let activeCat = 'all';

    function updateNavBadge() {
      const countEl = document.getElementById('nav-quote-count');
      if (countEl) {
        const totals = quotationManager.calculateTotals();
        countEl.textContent = totals.itemCount;
      }
    }

    function renderGrid() {
      const grid = document.getElementById('dashcam-grid');
      if (!grid) return;

      const filtered = activeCat === 'all' 
        ? DASHCAM_ITEMS 
        : DASHCAM_ITEMS.filter(item => item.category === activeCat);

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-dim); padding: 3rem;">沒有符合此分類的項目。</div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => {
        const isAdded = quotationManager.quoteItems.some(i => i.id === item.id);
        
        return `
          <div class="dashcam-card">
            <div class="dashcam-card-img-wrap">
              <img src="${item.image}" alt="${item.name}" class="dashcam-card-img">
              <span class="dashcam-card-badge">${item.badge}</span>
            </div>
            
            <div class="dashcam-card-content">
              <div>
                <h3 class="dashcam-card-title">${item.name}</h3>
                <span class="dashcam-card-fitment"><i class="fas fa-check-circle"></i> ${item.fitmentText}</span>
                <p class="dashcam-card-note">${item.note}</p>
              </div>

              <div class="dashcam-card-footer">
                <div class="dashcam-price-wrap">
                  ${item.originalPrice ? `<span class="dashcam-price-orig">原價 NT$ ${item.originalPrice.toLocaleString()}</span>` : ''}
                  <span class="dashcam-price-val">NT$ ${item.price.toLocaleString()}</span>
                  <span style="font-size: 0.74rem; color: #059669; font-weight: 700; margin-top: 2px;"><i class="fas fa-check-circle"></i> 已含安裝費</span>
                </div>

                <button class="btn-add-quote ${isAdded ? 'added' : ''}" data-id="${item.id}">
                  <i class="fas ${isAdded ? 'fa-check' : 'fa-plus'}"></i>
                  <span>${isAdded ? '已加入報價' : '加入報價單'}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Attach event listeners to Add buttons
      grid.querySelectorAll('.btn-add-quote').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const id = btn.getAttribute('data-id');
          const item = DASHCAM_ITEMS.find(i => i.id === id);
          if (!item) return;

          const isAdded = quotationManager.quoteItems.some(i => i.id === id);
          if (isAdded) {
            quotationManager.removeItem(id, 'electrical');
            btn.classList.remove('added');
            btn.innerHTML = `<i class="fas fa-plus"></i><span>加入報價單</span>`;
          } else {
            quotationManager.addItem(id, 'electrical', null, {
              name: item.name,
              price: item.price,
              variantTitle: item.fitmentText,
              store: '📷行車記錄器/電子後視鏡'
            });
            btn.classList.add('added');
            btn.innerHTML = `<i class="fas fa-check"></i><span>已加入報價</span>`;
          }
          updateNavBadge();
        });
      });
    }

    // Category Filter Buttons Event
    document.querySelectorAll('.dashcam-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        document.querySelectorAll('.dashcam-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeCat = pill.getAttribute('data-cat');
        renderGrid();
      });
    });

    // Quote Drawer Interactions
    const openBtn = document.getElementById('btn-open-quote-drawer');
    const closeBtn = document.getElementById('btn-close-quote-drawer');
    const drawer = document.getElementById('quote-drawer');
    const overlay = document.getElementById('drawer-overlay');

    function openDrawer() {
      quotationManager.renderDrawerContent('drawer-content-area');
      drawer.classList.add('open');
      overlay.classList.add('open');
      bindDrawerEvents();
    }

    function closeDrawer() {
      drawer.classList.remove('open');
      overlay.classList.remove('open');
    }

    function bindDrawerEvents() {
      // Quantity and remove buttons in drawer
      const container = document.getElementById('drawer-content-area');
      if (!container) return;

      container.querySelectorAll('.btn-remove-quote-item').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-id');
          const type = btn.getAttribute('data-type');
          const vId = btn.getAttribute('data-vid') || null;
          quotationManager.removeItem(id, type, vId);
          openDrawer();
          updateNavBadge();
          renderGrid();
        });
      });

      const copyBtn = document.getElementById('btn-copy-line-quote');
      if (copyBtn) {
        copyBtn.addEventListener('click', () => {
          const text = quotationManager.generateLineFormatText('特斯拉全車系');
          navigator.clipboard.writeText(text).then(() => {
            copyBtn.innerHTML = `<i class="fas fa-check"></i> 已複製 LINE 報價單！`;
            setTimeout(() => {
              copyBtn.innerHTML = `<i class="fab fa-line"></i> 複製客戶 LINE 格式報價單`;
            }, 2500);
          });
        });
      }
    }

    if (openBtn) openBtn.addEventListener('click', openDrawer);
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);

    // Theme toggle
    const themeBtn = document.getElementById('btn-theme-toggle');
    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', newTheme);
        themeBtn.querySelector('i').className = newTheme === 'light' ? 'fas fa-sun' : 'fas fa-moon';
      });
    }

    // Init Page
    renderGrid();
    updateNavBadge();
  </script>
</body>
</html>
